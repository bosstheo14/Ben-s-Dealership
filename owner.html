<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner tools — NewMississippi Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .rowitem{background:var(--paper); border:1px solid var(--line); padding:14px 16px; display:flex; gap:14px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
    .rowitem .thumb{width:84px; height:63px; object-fit:cover; background:var(--wash); flex:none;}
    .rowitem .meta{flex:1; min-width:180px;}
    .rowitem .meta b{font-size:17px;}
    .rowitem .meta span{display:block; color:var(--muted); font-size:14.5px;}
    .tabs{display:flex; gap:4px; border-bottom:2px solid var(--navy); margin-bottom:24px; flex-wrap:wrap;}
    .tabs button{background:none; border:0; border-bottom:4px solid transparent; padding:11px 16px; font-weight:700; cursor:pointer; margin-bottom:-2px;}
    .tabs button[aria-selected="true"]{border-bottom-color:var(--gold);}
    .photostrip{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
    .photostrip figure{margin:0; position:relative;}
    .photostrip img{width:104px; height:78px; object-fit:cover; border:1px solid var(--line);}
    .photostrip button{position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:var(--paper); cursor:pointer; line-height:1; font-weight:700;}
  </style>
</head>
<body data-page="owner.html">
  <header id="site-header"></header>
  <main>
    <section class="banner"><div class="wrap">
      <h1>Owner tools</h1>
      <p>Add vehicles, post announcements and update your hours without touching any code.</p>
    </div></section>
    <section class="section"><div class="wrap"><div id="owner"></div></div></section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/owner.js"></script>
</body>
</html>
